syntax="proto3";
package comms;
service Communication{
    rpc FetchEnvironmentStream (Command) returns (stream JSONData);
    rpc FetchNeuralNet (ID) returns (JSONData);
}

message Command{
    string In = 1;
}
message ID{
    int32 id =1;
}
message JSONData{
    string json_data=1;
    bool success=2;
    string message=3;
}
